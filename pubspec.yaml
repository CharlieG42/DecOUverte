name: decouverte
description: "Générateur d'affiches pour l'initiation à la Course d'Orientation"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.0
  qr_flutter: ^4.1.0
  pretty_qr: ^3.3.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_picker: ^8.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/charter/
  fonts:
    - family: Comfortaa
      fonts:
        - asset: fonts/Comfortaa-Bold.ttf
        - asset: fonts/Comfortaa-Regular.ttf
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Bold.ttf
        - asset: fonts/Nunito-Regular.ttf
